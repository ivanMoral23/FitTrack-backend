apiVersion: apps/v1
kind: Deployment
metadata:
  name: gymtracker-mongodb
  namespace: gymtracker
  labels:
    app: gymtracker-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gymtracker-mongodb
  template:
    metadata:
      labels:
        app: gymtracker-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: gymtracker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gymtracker-mongodb
  namespace: gymtracker
spec:
  selector:
    app: gymtracker-mongodb
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP
